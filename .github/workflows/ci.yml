name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Valida mensagens de commit
        if: github.event_name == 'pull_request'
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\([a-z0-9_-]+\))?: .+'
          fail=0
          while IFS= read -r line; do
            sha=$(cut -d' ' -f1 <<< "$line")
            msg=$(cut -d' ' -f2- <<< "$line")
            if [[ ! "$msg" =~ $pattern ]]; then
              echo "::error::Commit $sha não segue o padrão 'tipo: descrição' — \"$msg\""
              fail=1
            fi
          done < <(git log --no-merges --pretty=format:"%h %s" "origin/${{ github.event.pull_request.base.ref }}..HEAD")
          exit $fail

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Testes
        run: npm test

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: npm run build
